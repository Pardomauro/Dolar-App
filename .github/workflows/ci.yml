name: CI

on:
    pull_request:
        branches: [ master ]
    push:
        branches: [ master ]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest 
        timeout-minutes: 10
        defaults:
            run:
                working-directory: appDolarHoy
        steps:
            - name: Checkout del codigo
              uses: actions/checkout@v4

            - name: Instalar Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: npm
                cache-dependency-path: appDolarHoy/package-lock.json
                  
            - name: Se instalan las dependencias
              run: npm ci
                    
            - name: Se ejecuta el linter
              run: npm run lint
            
            - name: Se ejecutan los tests
              run: npm run test
            

            - name: Se construye la aplicacion
              run: npm run build
              env: 
                VITE_API_URL: ${{ vars.VITE_API_URL }}

            - name: Verificar variable en bundle (temporal)
              run: grep -rl "ejemplo-prueba.com" dist



