name: Secrets Demo

on:
    push: 
        branches: [ ci/secrets ]

permissions:
    contents: read

jobs:
    secrets-demo:
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
          - name: Mostrar el secreto
            run: echo "El secreto es $DEMO_SECRET"
            env: 
              DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
            
          - name: Mostrar el secreto con caracteres separados
            run: echo "$DEMO_SECRET" | sed 's/./& /g'
            env: 
              DEMO_SECRET: ${{ secrets.DEMO_SECRET }}

          - name: Mostrar la variable
            run: echo "La variable es ${{ vars.VITE_API_URL }}"
